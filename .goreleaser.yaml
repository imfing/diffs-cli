version: 2

project_name: diffs

before:
  hooks:
    - pnpm install --frozen-lockfile
    - pnpm --dir web build
    - rm -rf internal/webassets/dist
    - mkdir -p internal/webassets/dist
    - cp -R web/dist/. internal/webassets/dist
    - touch internal/webassets/dist/.gitkeep

builds:
  - id: diffs
    main: ./cmd/diffs
    binary: diffs
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: diffs
    ids:
      - diffs
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

release:
  github:
    owner: imfing
    name: diffs-cli

homebrew_casks:
  - name: diffs
    ids:
      - diffs
    binaries:
      - diffs
    repository:
      owner: imfing
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Casks
    url:
      verified: github.com/imfing/diffs-cli/
    homepage: "https://github.com/imfing/diffs-cli"
    description: "Fast, beautiful diffs on the Go"
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/diffs"]
          end

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
