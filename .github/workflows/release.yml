name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  web:
    name: Build web assets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Verify version matches tag
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          crate="$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')"
          if [ "$tag" != "$crate" ]; then
            echo "::error::tag v$tag does not match Cargo.toml version $crate"
            exit 1
          fi
          echo "Releasing version $crate"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint web
        run: pnpm --dir web lint

      - name: Build web
        run: pnpm --dir web build

      - name: Upload web assets
        uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: web/dist
          if-no-files-found: error
          retention-days: 1

  check:
    name: Check
    needs: web
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download web assets
        uses: actions/download-artifact@v7
        with:
          name: web-dist
          path: web/dist

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: Run tests
        run: cargo test --all-targets --locked

  build:
    name: Build ${{ matrix.os_label }}_${{ matrix.arch_label }}
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            os_label: linux
            arch_label: amd64
          - runner: ubuntu-24.04-arm
            os_label: linux
            arch_label: arm64
          - runner: macos-13
            os_label: darwin
            arch_label: amd64
          - runner: macos-14
            os_label: darwin
            arch_label: arm64
          - runner: windows-latest
            os_label: windows
            arch_label: amd64
          - runner: windows-11-arm
            os_label: windows
            arch_label: arm64
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download web assets
        uses: actions/download-artifact@v7
        with:
          name: web-dist
          path: web/dist

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os_label }}-${{ matrix.arch_label }}

      - name: Build release binary
        run: cargo build --release --locked

      - name: Package (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          name="diffs_${version}_${{ matrix.os_label }}_${{ matrix.arch_label }}"
          mkdir -p "dist/${name}"
          cp target/release/diffs "dist/${name}/"
          cp LICENSE README.md "dist/${name}/"
          tar -C "dist/${name}" -czf "dist/${name}.tar.gz" diffs LICENSE README.md

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = "${env:GITHUB_REF_NAME}".TrimStart("v")
          $name = "diffs_${version}_${{ matrix.os_label }}_${{ matrix.arch_label }}"
          New-Item -ItemType Directory -Force -Path "dist/$name" | Out-Null
          Copy-Item target/release/diffs.exe "dist/$name/"
          Copy-Item LICENSE,README.md "dist/$name/"
          Compress-Archive -Path "dist/$name/*" -DestinationPath "dist/$name.zip"

      - name: Upload archive
        uses: actions/upload-artifact@v7
        with:
          name: archive-${{ matrix.os_label }}-${{ matrix.arch_label }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download archives
        uses: actions/download-artifact@v7
        with:
          pattern: archive-*
          path: dist
          merge-multiple: true

      - name: Generate checksums
        shell: bash
        working-directory: dist
        run: |
          shasum -a 256 * > checksums.txt
          cat checksums.txt

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
          generate_release_notes: true

  homebrew:
    name: Update Homebrew cask
    needs: release
    runs-on: ubuntu-latest
    if: ${{ !contains(github.ref_name, '-') }}

    steps:
      - name: Download archives
        uses: actions/download-artifact@v7
        with:
          pattern: archive-*
          path: dist
          merge-multiple: true

      - name: Render cask
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          sha_arm="$(shasum -a 256 "dist/diffs_${version}_darwin_arm64.tar.gz" | awk '{print $1}')"
          sha_intel="$(shasum -a 256 "dist/diffs_${version}_darwin_amd64.tar.gz" | awk '{print $1}')"
          mkdir -p out/Casks
          cat > out/Casks/diffs.rb <<EOF
          cask "diffs" do
            version "${version}"

            on_arm do
              sha256 "${sha_arm}"
              url "https://github.com/imfing/diffs-cli/releases/download/v#{version}/diffs_#{version}_darwin_arm64.tar.gz"
            end
            on_intel do
              sha256 "${sha_intel}"
              url "https://github.com/imfing/diffs-cli/releases/download/v#{version}/diffs_#{version}_darwin_amd64.tar.gz"
            end

            name "diffs"
            desc "A tiny CLI for fast, beautiful local-first diffs in the browser"
            homepage "https://github.com/imfing/diffs-cli"

            binary "diffs"

            postflight do
              system_command "/usr/bin/xattr",
                             args: ["-dr", "com.apple.quarantine", "#{staged_path}/diffs"]
            end
          end
          EOF
          cat out/Casks/diffs.rb

      - name: Push to homebrew tap
        shell: bash
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/imfing/homebrew-tap.git" tap
          mkdir -p tap/Casks
          cp out/Casks/diffs.rb tap/Casks/diffs.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/diffs.rb
          if git diff --cached --quiet; then
            echo "Cask already up to date"
          else
            git commit -m "diffs ${version}"
            git push
          fi
